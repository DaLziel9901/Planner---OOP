<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${editing ? 'Sửa Sub Task' : 'Thêm Sub Task'}, 'tasks', ~{::main})}">
<head><title>Planner</title></head>
<body>
<main id="main-content" class="page-content page-content--form" tabindex="-1">
    <a class="back-link" th:if="${task != null}" th:href="@{/tasks/{id}(id=${task.id})}">
        <span aria-hidden="true">←</span> Về Task
    </a>
    <a class="back-link" th:unless="${task != null}" th:href="@{/tasks}">
        <span aria-hidden="true">←</span> Task độc lập
    </a>
    <div class="planning-heading">
        <div>
            <h1 th:text="${editing ? 'Sửa Sub Task' : 'Thêm Sub Task'}"></h1>
            <p th:if="${task != null}">Task cha <strong th:text="${task.title}"></strong></p>
        </div>
    </div>
    <ul th:replace="~{fragments/planning :: errors(${errors})}"></ul>
    <form class="planning-form" method="post" th:action="${formAction}">
        <div class="field" th:unless="${editing}">
            <label for="taskId">ID Task cha <span aria-hidden="true">*</span></label>
            <input id="taskId" name="taskId" th:value="${taskIdInput}" inputmode="numeric" required
                   th:attr="aria-invalid=${errors['taskId'] == null ? null : 'true'},
                            aria-describedby=${errors['taskId'] == null ? 'task-id-help' : 'task-id-error task-id-help'}">
            <p class="field-help" id="task-id-help">Mở form từ trang Task để điền sẵn ID.</p>
            <p class="field-error" id="task-id-error" th:if="${errors['taskId'] != null}"><th:block th:replace="~{fragments/labels :: feedback(${errors['taskId']})}"></th:block></p>
        </div>
        <div class="field">
            <label for="title">Tên Sub Task <span aria-hidden="true">*</span></label>
            <input id="title" name="title" th:value="${form['title']}" required
                   th:attr="aria-invalid=${errors['title'] == null ? null : 'true'},
                            aria-describedby=${errors['title'] == null ? 'title-help' : 'title-error title-help'}">
            <p class="field-help" id="title-help">Tối đa 255 ký tự. Tên có thể trùng.</p>
            <p class="field-error" id="title-error" th:if="${errors['title'] != null}"><th:block th:replace="~{fragments/labels :: feedback(${errors['title']})}"></th:block></p>
        </div>
        <div class="field">
            <label for="description">Mô tả</label>
            <textarea id="description" name="description" rows="4" th:text="${form['description']}"></textarea>
        </div>
        <div class="date-fields">
            <div>
                <div th:replace="~{fragments/planning :: dateField('scheduledDate', 'Ngày dự kiến', ${form['scheduledDate']}, ${errors['scheduledDate']})}"></div>
                <p class="field-help" id="date-help">Bỏ trống nếu chưa xếp lịch.</p>
            </div>
            <div th:replace="~{fragments/work-items :: orderField(${form['orderIndex']}, ${errors['orderIndex']})}"></div>
        </div>
        <div class="form-actions">
            <button type="submit">Lưu Sub Task</button>
            <a class="button" th:if="${task != null}" th:href="@{/tasks/{id}(id=${task.id})}">Hủy</a>
            <a class="button" th:unless="${task != null}" th:href="@{/tasks}">Hủy</a>
        </div>
    </form>
</main>
</body>
</html>
