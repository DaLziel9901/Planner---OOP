<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Danh sách SubTask</title></head>
<body><main>
    <p th:if="${message}" th:text="${message}" role="status"></p>
    <h1>Danh sách SubTask</h1>
    <ul role="alert" th:if="${!errors.isEmpty()}"><li th:each="error : ${errors}" th:text="${error.value}"></li></ul>
    <p th:if="${task == null}"><a th:href="@{/tasks}">Chọn một Task từ danh sách</a></p>
    <section th:if="${task != null}">
        <p>Task: <a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.title}"></a></p>
        <p><a th:href="@{/subtasks/new(taskId=${task.id})}">Thêm SubTask</a></p>
        <p th:if="${#lists.isEmpty(subTasks)}">Chưa có SubTask.</p>
        <table th:unless="${#lists.isEmpty(subTasks)}">
            <thead><tr><th>Tên</th><th>Ngày dự kiến</th><th>Thứ tự</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody><tr th:each="leaf : ${subTasks}">
                <td><a th:href="@{/subtasks/{id}(id=${leaf.id})}" th:text="${leaf.title}"></a></td>
                <td th:text="${leaf.scheduledDate}"></td><td th:text="${leaf.orderIndex}"></td>
                <td th:text="${leaf.done ? 'Đã hoàn thành' : 'Chưa hoàn thành'}"></td>
                <td><a th:href="@{/subtasks/{id}/edit(id=${leaf.id})}">Sửa</a></td>
            </tr></tbody>
        </table>
    </section>
</main></body></html>
