<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Danh sách công việc con', 'tasks', ~{::main})}">
<head><title>Planner</title></head>
<body>
<main id="main-content" class="page-content" tabindex="-1">
    <div class="planning-heading">
        <div>
            <h1>Việc nhỏ</h1>
            <p th:if="${task != null}">Công việc <a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.title}"></a></p>
        </div>
        <a class="button button--primary" th:if="${task != null}" th:href="@{/subtasks/new(taskId=${task.id})}">
            <span aria-hidden="true">+</span> Thêm việc nhỏ
        </a>
    </div>
    <p th:replace="~{fragments/labels :: flash(${message})}"></p>
    <ul th:replace="~{fragments/planning :: errors(${errors})}"></ul>
    <section class="empty-panel" th:if="${task == null}">
        <h2>Chọn một công việc để xem các việc nhỏ</h2>
        <div class="planning-actions work-empty-actions">
            <a class="button button--primary" th:href="@{/tasks}">Công việc độc lập</a>
            <a class="button" th:href="@{/plans}">Kế hoạch</a>
        </div>
    </section>
    <th:block th:if="${task != null}">
        <section class="planning-panel work-section">
            <h2>Tiến độ công việc cha</h2>
            <div th:replace="~{fragments/progress :: indicator(${progress})}"></div>
        </section>
        <section class="planning-panel work-section">
            <h2>Việc nhỏ</h2>
            <p class="planning-state" th:if="${treeAvailable and #lists.isEmpty(subTasks)}">Chưa có việc nhỏ.</p>
            <p class="planning-state" th:unless="${treeAvailable}">Chưa tải đầy đủ danh sách việc nhỏ.</p>
            <div data-week-view th:if="${treeAvailable and !#lists.isEmpty(subTasks)}"
                 th:attr="data-task-id=${task.id}">
                <div class="week-filter" data-week-controls hidden>
                    <div class="week-filter__field">
                        <label for="week-anchor">Chọn ngày trong tuần</label>
                        <input id="week-anchor" type="date">
                    </div>
                    <button type="button" data-week-today>Tuần này</button>
                    <button type="button" data-week-reset>Tất cả</button>
                    <p class="muted week-filter__summary" data-week-summary aria-live="polite"></p>
                </div>
                <ul th:replace="~{fragments/work-items :: subtaskList(${subTasks}, ${task.id}, 'subtasks')}"></ul>
                <p class="planning-state" data-week-empty hidden>Không có việc nhỏ được xếp lịch trong tuần này.</p>
                <script defer th:src="@{/js/subtask-week.js}"></script>
            </div>
        </section>
    </th:block>
</main>
</body>
</html>
