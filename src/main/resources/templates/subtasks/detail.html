<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết SubTask</title></head>
<body><main>
    <p th:if="${message}" th:text="${message}" role="status"></p>
    <h1 th:text="${subTask.title}"></h1>
    <p>Tiến độ Task: <span th:text="${progress.label}"></span></p>
    <p>Task: <a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.title}"></a></p>
    <p th:text="${subTask.description}" style="white-space: pre-wrap"></p>
    <dl><dt>Ngày dự kiến</dt><dd th:text="${subTask.scheduledDate}"></dd>
        <dt>Thứ tự</dt><dd th:text="${subTask.orderIndex}"></dd>
        <dt>Trạng thái</dt><dd th:text="${subTask.done ? 'Đã hoàn thành' : 'Chưa hoàn thành'}"></dd>
        <dt>Thời điểm hoàn thành</dt><dd th:text="${subTask.completedAt}"></dd>
        <dt>Thời điểm tạo</dt><dd th:text="${subTask.createdAt}"></dd></dl>
    <form method="post" th:action="@{/subtasks/{id}/completion(id=${subTask.id})}">
        <button type="submit" name="done" th:value="${!subTask.done}"
                th:text="${subTask.done ? 'Bỏ đánh dấu hoàn thành' : 'Đánh dấu hoàn thành'}"></button>
    </form>
    <p><a th:href="@{/subtasks/{id}/edit(id=${subTask.id})}">Sửa SubTask</a>
        | <a th:href="@{/subtasks(taskId=${task.id})}">Các SubTask cùng Task</a></p>
    <form method="post" th:action="@{/subtasks/{id}/delete(id=${subTask.id})}"
          onsubmit="return confirm('Xóa SubTask này?');">
        <button type="submit">Xóa SubTask này</button>
    </form>
</main></body></html>
