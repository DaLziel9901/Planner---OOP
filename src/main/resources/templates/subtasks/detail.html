<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Chi tiết Sub Task', 'tasks', ~{::main})}">
<head><title>Planner</title></head>
<body>
<main id="main-content" class="page-content" tabindex="-1">
    <nav class="planning-breadcrumb" aria-label="Đường dẫn Task">
        <a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.title}"></a>
        <a th:href="@{/subtasks(taskId=${task.id})}">Các Sub Task cùng nhóm</a>
    </nav>
    <div class="planning-heading">
        <h1 th:text="${subTask.title}"></h1>
        <a class="button" th:href="@{/subtasks/{id}/edit(id=${subTask.id})}">Sửa Sub Task</a>
    </div>
    <p th:replace="~{fragments/labels :: flash(${message})}"></p>
    <div class="planning-grid">
        <section class="planning-panel">
            <div class="section-heading subtask-status">
                <span th:replace="~{fragments/work-items :: status(${subTask.done})}"></span>
                <form th:replace="~{fragments/work-items :: completion(${subTask}, ${null}, ${null}, true)}"></form>
            </div>
            <h2>Mô tả</h2>
            <p class="preserve-lines" th:unless="${#strings.isEmpty(subTask.description)}" th:text="${subTask.description}"></p>
            <p class="muted" th:if="${#strings.isEmpty(subTask.description)}">Chưa có mô tả.</p>
            <dl class="metadata">
                <div><dt>Ngày dự kiến</dt><dd><span th:replace="~{fragments/planning :: date(${subTask.scheduledDate})}"></span></dd></div>
                <div><dt>Thứ tự</dt><dd th:text="${subTask.orderIndex}"></dd></div>
                <div><dt>Thời điểm hoàn thành</dt><dd><span th:replace="~{fragments/work-items :: timestamp(${subTask.completedAt})}"></span></dd></div>
                <div><dt>Thời điểm tạo</dt><dd><span th:replace="~{fragments/work-items :: timestamp(${subTask.createdAt})}"></span></dd></div>
            </dl>
        </section>
        <section class="planning-panel">
            <h2>Tiến độ Task cha</h2>
            <div th:replace="~{fragments/progress :: indicator(${progress})}"></div>
        </section>
    </div>
    <section class="danger-panel">
        <div><h2>Xóa Sub Task</h2></div>
        <form class="delete-form" method="post" th:action="@{/subtasks/{id}/delete(id=${subTask.id})}"
              onsubmit="return confirm('Xóa Sub Task này?');">
            <button type="submit">Xóa Sub Task này</button>
        </form>
    </section>
</main>
</body>
</html>
