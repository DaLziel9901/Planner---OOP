<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Form Task</title></head>
<body><main>
    <h1 th:text="${editing ? 'Sửa Task' : 'Thêm Task độc lập'}"></h1>
    <ul role="alert" th:if="${!errors.isEmpty()}"><li th:each="error : ${errors}" th:text="${error.value}"></li></ul>
    <form method="post" th:action="${formAction}">
        <p><label for="title">Tên Task *</label><br>
            <input id="title" name="title" th:value="${form['title']}" required aria-describedby="title-help title-error">
            <small id="title-help">Từ 1 đến 255 ký tự, không chỉ chứa khoảng trắng. Task được phép trùng tên.</small>
            <span id="title-error" th:text="${errors['title']}"></span></p>
        <p><label for="description">Mô tả</label><br>
            <textarea id="description" name="description" rows="4" th:text="${form['description']}"></textarea></p>
        <p><label for="startDate">Ngày bắt đầu (yyyy-MM-dd)</label><br>
            <input id="startDate" name="startDate" th:value="${form['startDate']}" placeholder="2026-11-16" aria-describedby="start-error">
            <span id="start-error" th:text="${errors['startDate']}"></span></p>
        <p><label for="endDate">Ngày kết thúc (yyyy-MM-dd)</label><br>
            <input id="endDate" name="endDate" th:value="${form['endDate']}" placeholder="2026-12-16" aria-describedby="end-error">
            <span id="end-error" th:text="${errors['endDate']}"></span></p>
        <p><label for="orderIndex">Thứ tự</label><br>
            <input id="orderIndex" name="orderIndex" th:value="${form['orderIndex']}" inputmode="numeric" aria-describedby="order-error">
            <span id="order-error" th:text="${errors['orderIndex']}"></span></p>
        <p>Mô tả và ngày có thể để trống. Nếu nhập cả hai ngày, ngày bắt đầu không được sau ngày kết thúc. Thứ tự là số nguyên không âm, để trống dùng 0.</p>
        <button type="submit">Lưu Task</button> <a th:href="@{/tasks}">Về danh sách</a>
    </form>
</main></body></html>
