<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${editing ? 'Sửa Task' : 'Thêm Task'}, 'tasks', ~{::main})}">
<head><title>Planner</title></head>
<body>
<main id="main-content" class="page-content page-content--form" tabindex="-1">
    <a class="back-link" th:href="${taskListUrl != null ? taskListUrl : '/tasks'}">
        <span aria-hidden="true">←</span> Danh sách Task
    </a>
    <div class="planning-heading">
        <div>
            <h1 th:text="${editing ? 'Sửa Task' : 'Thêm Task'}"></h1>
            <p th:if="${editing and locationLabel != null}"><th:block th:replace="~{fragments/labels :: location(${locationLabel})}"></th:block></p>
        </div>
    </div>
    <ul th:replace="~{fragments/planning :: errors(${errors})}"></ul>
    <form class="planning-form" method="post" th:action="${formAction}">
        <div class="field">
            <label for="title">Tên Task <span aria-hidden="true">*</span></label>
            <input id="title" name="title" th:value="${form['title']}" required
                   th:attr="aria-invalid=${errors['title'] == null ? null : 'true'},
                            aria-describedby=${errors['title'] == null ? 'title-help' : 'title-error title-help'}">
            <p class="field-help" id="title-help">Tối đa 255 ký tự. Tên có thể trùng.</p>
            <p class="field-error" id="title-error" th:if="${errors['title'] != null}"><th:block th:replace="~{fragments/labels :: feedback(${errors['title']})}"></th:block></p>
        </div>
        <div class="field">
            <label for="description">Mô tả</label>
            <textarea id="description" name="description" rows="4" th:text="${form['description']}"></textarea>
        </div>
        <fieldset class="location-fields" th:unless="${editing}"
                  th:attr="aria-describedby=${errors['location'] == null ? 'location-help' : 'location-error location-help'}">
            <legend>Thuộc mục nào?</legend>
            <p class="field-help" id="location-help">Chọn một mục tiêu hoặc một mục tiêu nhỏ. Để trống cả hai cho Task độc lập.</p>
            <p class="field-error" id="location-error" th:if="${errors['location'] != null}"><th:block th:replace="~{fragments/labels :: feedback(${errors['location']})}"></th:block></p>
            <div class="date-fields">
                <div class="field">
                    <label for="planId">Mục tiêu</label>
                    <select id="planId" name="planId"
                            th:attr="aria-invalid=${errors['planId'] != null or errors['location'] != null ? 'true' : null},
                                     aria-describedby=${errors['planId'] == null ? null : 'plan-id-error'}">
                        <option value="">Không chọn mục tiêu</option>
                        <option th:unless="${planSelectionKnown}" th:value="${locationForm['planId']}" selected
                                th:text="${'Giá trị đã gửi: ' + locationForm['planId']}"></option>
                        <option th:each="plan : ${plans}" th:value="${plan.id}" th:selected="${plan.id.toString() == locationForm['planId']}"
                                th:text="|#${plan.id} · ${plan.title}|"></option>
                    </select>
                    <p class="field-error" id="plan-id-error" th:if="${errors['planId'] != null}"><th:block th:replace="~{fragments/labels :: feedback(${errors['planId']})}"></th:block></p>
                </div>
                <div class="field">
                    <label for="subPlanId">Mục tiêu nhỏ</label>
                    <select id="subPlanId" name="subPlanId"
                            th:attr="aria-invalid=${errors['subPlanId'] != null or errors['location'] != null ? 'true' : null},
                                     aria-describedby=${errors['subPlanId'] == null ? null : 'subplan-id-error'}">
                        <option value="">Không chọn mục tiêu nhỏ</option>
                        <option th:unless="${subPlanSelectionKnown}" th:value="${locationForm['subPlanId']}" selected
                                th:text="${'Giá trị đã gửi: ' + locationForm['subPlanId']}"></option>
                        <option th:each="sub : ${subPlans}" th:value="${sub.id}" th:selected="${sub.id.toString() == locationForm['subPlanId']}"
                                th:text="|#${sub.id} · ${sub.title} (Mục tiêu #${sub.planId})|"></option>
                    </select>
                    <p class="field-error" id="subplan-id-error" th:if="${errors['subPlanId'] != null}"><th:block th:replace="~{fragments/labels :: feedback(${errors['subPlanId']})}"></th:block></p>
                </div>
            </div>
        </fieldset>
        <div class="date-fields">
            <div th:replace="~{fragments/planning :: dateField('startDate', 'Ngày bắt đầu', ${form['startDate']}, ${errors['startDate']})}"></div>
            <div th:replace="~{fragments/planning :: dateField('endDate', 'Ngày kết thúc', ${form['endDate']}, ${errors['endDate']})}"></div>
        </div>
        <p class="field-help" id="date-help">Ngày có thể để trống. Nếu nhập cả hai mốc, ngày kết thúc phải bằng hoặc sau ngày bắt đầu.</p>
        <div th:replace="~{fragments/work-items :: orderField(${form['orderIndex']}, ${errors['orderIndex']})}"></div>
        <div class="form-actions">
            <button type="submit">Lưu Task</button>
            <a class="button" th:href="${taskListUrl != null ? taskListUrl : '/tasks'}">Hủy</a>
        </div>
    </form>
</main>
</body>
</html>
