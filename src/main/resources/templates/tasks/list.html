<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Danh sách công việc', 'tasks', ~{::main})}">
<head><title>Planner</title></head>
<body>
<main id="main-content" class="page-content" tabindex="-1">
    <nav class="planning-breadcrumb" aria-label="Đường dẫn công việc" th:if="${parentUrl != null}">
        <a th:href="${parentUrl}">Về mục cha</a>
        <a th:href="@{/tasks}">Công việc độc lập</a>
    </nav>
    <div class="planning-heading">
        <div>
            <h1><th:block th:replace="~{fragments/labels :: location(${locationLabel})}"></th:block></h1>
            <p th:unless="${#lists.isEmpty(tasks)}" th:text="|${#lists.size(tasks)} công việc|"></p>
        </div>
        <a class="button button--primary" th:href="${newTaskUrl}"><span aria-hidden="true">+</span> Thêm công việc</a>
    </div>
    <p th:replace="~{fragments/labels :: flash(${message})}"></p>
    <p class="planning-state" th:unless="${progressAvailable}">Chưa có tiến độ khả dụng.</p>
    <section class="empty-panel" th:if="${#lists.isEmpty(tasks)}">
        <h2 th:text="${parentUrl == null ? 'Chưa có công việc độc lập' : 'Chưa có công việc trực tiếp ở đây'}"></h2>
        <p>Tạo công việc để thêm các việc nhỏ và theo dõi tiến độ.</p>
    </section>
    <ul class="work-list" th:unless="${#lists.isEmpty(tasks)}">
        <li class="work-row" th:each="task : ${tasks}">
            <div class="work-row__summary">
                <a class="item-title" th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.title}"></a>
                <p class="item-meta">
                    <span th:text="|#${task.id}|"></span>
                    <span th:text="|Thứ tự ${task.orderIndex}|"></span>
                    <span class="item-dates" th:if="${task.startDate != null or task.endDate != null}">
                        <span th:replace="~{fragments/planning :: date(${task.startDate})}"></span>
                        <span aria-hidden="true">→</span>
                        <span th:replace="~{fragments/planning :: date(${task.endDate})}"></span>
                    </span>
                </p>
            </div>
            <div th:replace="~{fragments/progress :: indicator(${progressById[task.id]})}"></div>
            <a class="button" th:href="@{/tasks/{id}/edit(id=${task.id})}"
               th:attr="aria-label=|Sửa ${task.title}|">Sửa</a>
        </li>
    </ul>
</main>
</body>
</html>
