<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết Task</title></head>
<body><main>
    <p th:if="${message}" th:text="${message}" role="status"></p>
    <h1 th:text="${task.title}"></h1>
    <p th:text="${locationLabel}"></p>
    <p th:if="${parentUrl != null}"><a th:href="${parentUrl}">Về cha</a></p>
    <p th:text="${task.description}" style="white-space: pre-wrap"></p>
    <dl><dt>Ngày bắt đầu</dt><dd th:text="${task.startDate}"></dd>
        <dt>Ngày kết thúc</dt><dd th:text="${task.endDate}"></dd>
        <dt>Thứ tự</dt><dd th:text="${task.orderIndex}"></dd>
        <dt>Thời điểm tạo</dt><dd th:text="${task.createdAt}"></dd></dl>
    <p th:unless="${progressAvailable}">Chưa có tiến độ khả dụng.</p>
    <h2>SubTask</h2>
    <p><a th:href="@{/subtasks/new(taskId=${task.id})}">Thêm SubTask</a>
        | <a th:href="@{/subtasks(taskId=${task.id})}">Xem các SubTask</a></p>
    <p th:if="${#lists.isEmpty(subTasks)}">Chưa có SubTask.</p>
    <table th:unless="${#lists.isEmpty(subTasks)}">
        <thead><tr><th>Tên</th><th>Ngày dự kiến</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody><tr th:each="leaf : ${subTasks}">
            <td><a th:href="@{/subtasks/{id}(id=${leaf.id})}" th:text="${leaf.title}"></a></td>
            <td th:text="${leaf.scheduledDate}"></td><td th:text="${leaf.done ? 'Đã hoàn thành' : 'Chưa hoàn thành'}"></td>
            <td><a th:href="@{/subtasks/{id}/edit(id=${leaf.id})}">Sửa</a></td>
        </tr></tbody>
    </table>
    <p><a th:href="@{/tasks/{id}/edit(id=${task.id})}">Sửa Task</a> | <a th:href="${taskListUrl}">Về danh sách</a></p>
    <form method="post" th:action="@{/tasks/{id}/delete(id=${task.id})}"
          onsubmit="return confirm('Xóa Task này và toàn bộ SubTask bên dưới?');">
        <button type="submit">Xóa Task và toàn bộ SubTask</button>
    </form>
</main></body></html>
