<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{auth/layout :: page('Đăng nhập', ~{::main})}">
<body>
<main class="auth-content">
    <h1>Đăng nhập</h1>
    <p class="auth-intro">Mở kế hoạch và xem những việc cần làm hôm nay.</p>
    <p class="auth-alert" th:if="${param.error != null}" role="alert">Tên đăng nhập hoặc mật khẩu không đúng.</p>
    <form class="auth-form" method="post" th:action="@{/login}">
        <div class="auth-field">
            <label for="username">Tên đăng nhập</label>
            <input id="username" type="text" name="username" autocomplete="username" autocapitalize="none"
                   spellcheck="false" required>
        </div>
        <div class="auth-field">
            <label for="password">Mật khẩu</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="auth-submit" type="submit">Đăng nhập</button>
    </form>
    <p class="auth-switch">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
</main>
</body>
</html>
