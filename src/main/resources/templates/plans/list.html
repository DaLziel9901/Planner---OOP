<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Danh sách kế hoạch</title></head>
<body><main>
    <h1>Danh sách kế hoạch</h1>
    <p th:if="${message}" th:text="${message}" role="status"></p>
    <p><a th:href="@{/plans/new}">Thêm Plan</a> | <a th:href="@{/subplans}">Quản lý SubPlan</a> | <a th:href="@{/tasks}">Task độc lập</a></p>
    <p th:if="${#lists.isEmpty(plans)}">Chưa có kế hoạch. Chọn Thêm Plan để bắt đầu.</p>
    <table th:unless="${#lists.isEmpty(plans)}">
        <thead><tr><th>ID</th><th>Tên</th><th>Mục tiêu</th><th>Ngày bắt đầu</th><th>Ngày kết thúc</th><th>Thao tác</th></tr></thead>
        <tbody><tr th:each="plan : ${plans}">
            <td th:text="${plan.id}"></td>
            <td><a th:href="@{/plans/{id}(id=${plan.id})}" th:text="${plan.title}"></a></td>
            <td th:text="${plan.goal}"></td>
            <td th:text="${plan.startDate}"></td><td th:text="${plan.endDate}"></td>
            <td><a th:href="@{/plans/{id}/edit(id=${plan.id})}">Sửa</a>
                | <a th:href="@{/subplans(planId=${plan.id})}">Các SubPlan</a>
                | <a th:href="@{/tasks(planId=${plan.id})}">Task trực tiếp</a></td>
        </tr></tbody>
    </table>
    <p th:unless="${progressAvailable}">Chưa nạp toàn bộ cây công việc để tính tiến độ.</p>
</main></body></html>
