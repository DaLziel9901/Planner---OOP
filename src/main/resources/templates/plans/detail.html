<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Chi tiết mục tiêu', 'plan-detail', ~{::main})}">
<head><title>Planner</title></head>
<body>
<main id="main-content" class="page-content planner-home" tabindex="-1">
    <a class="back-link" th:href="@{/plans} + |#muc-tieu-${plan.id}|">
        <span aria-hidden="true">←</span> Tất cả mục tiêu
    </a>
    <p th:replace="~{fragments/labels :: flash(${message})}"></p>
    <div class="goal-stage">
        <article th:replace="~{fragments/workspace-goals :: goalPanel(${plan}, ${progress}, ${progressAvailable}, true)}"></article>
    </div>
    <section class="danger-panel">
        <div>
            <h2>Xóa mục tiêu</h2>
            <p>Tất cả mục tiêu nhỏ, Task và Sub Task thuộc mục tiêu này cũng sẽ bị xóa.</p>
        </div>
        <form method="post" th:action="@{/plans/{id}/delete(id=${plan.id})}" class="delete-form"
              onsubmit="return confirm('Xóa mục tiêu này và toàn bộ mục tiêu nhỏ, Task, Sub Task bên dưới?');">
            <button type="submit">Xóa mục tiêu</button>
        </form>
    </section>
</main>
</body>
</html>
