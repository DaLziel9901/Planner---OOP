<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
    <details class="reminder-widget" th:fragment="widget" data-reminders
             th:attr="data-workspace-url=@{/plans}">
        <summary class="reminder-trigger">
            <span class="reminder-trigger__icon" aria-hidden="true">
                <span class="reminder-trigger__dot" data-reminder-due hidden></span>
            </span>
            Nhắc nhở
        </summary>
        <section class="reminder-panel" aria-labelledby="reminder-heading">
            <header class="reminder-panel__header">
                <div>
                    <h2 id="reminder-heading">Nhắc nhở Task</h2>
                    <p>Sub Task thuộc các mục tiêu</p>
                </div>
                <button class="reminder-close" type="button" data-reminder-close aria-label="Đóng nhắc nhở" hidden>×</button>
            </header>
            <div class="reminder-panel__content">
                <noscript><p>Bật JavaScript để xem việc cần nhắc.</p></noscript>
                <p class="reminder-feedback" role="status" data-reminder-feedback hidden></p>
                <div data-reminder-content></div>
            </div>
        </section>
    </details>
</body>
</html>
