<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, section, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} · Planner|">Planner</title>
    <link rel="stylesheet" th:href="@{/css/planner.css}">
    <link rel="stylesheet" th:href="@{/css/workspace.css}">
    <link rel="stylesheet" th:href="@{/css/reminders.css}">
    <link rel="stylesheet" th:if="${section == 'tasks' or section == 'home' or section == 'plan-detail'}"
          th:href="@{/css/tasks.css}">
    <link rel="stylesheet" th:if="${section == 'home' or section == 'plan-detail'}" th:href="@{/css/workspace-home.css}">
    <link rel="stylesheet" th:if="${section == 'home'}" th:href="@{/css/workspace-insights.css}">
    <link rel="stylesheet" th:if="${section == 'ai'}" th:href="@{/css/ai-planner.css}">
    <script defer th:src="@{/js/navigation.js}"></script>
    <script defer th:src="@{/js/reminders.js}"></script>
    <script defer th:if="${section == 'home'}" th:src="@{/js/workspace-home.js}"></script>
    <script defer th:if="${section == 'home'}" th:src="@{/js/workspace-insights.js}"></script>
    <script defer th:if="${section == 'ai'}" th:src="@{/js/ai-planner.js}"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Đến nội dung chính</a>
    <div class="app-shell">
        <header class="app-header">
            <button class="menu-toggle" type="button" aria-expanded="false"
                    aria-controls="planner-sidebar" data-menu-toggle hidden>
                <span class="menu-icon" aria-hidden="true"></span>
                Điều hướng
            </button>
            <ol class="workspace-path" aria-label="Khu vực đang xem">
                <li><a th:href="@{/plans}">Planner</a></li>
                <li th:switch="${section}">
                    <span th:case="'home'" data-workspace-label>Kế hoạch</span>
                    <span th:case="'plan-detail'">Kế hoạch</span>
                    <span th:case="'plans'">Kế hoạch</span>
                    <span th:case="'subplans'">Giai đoạn</span>
                    <span th:case="'tasks'">Công việc</span>
                    <span th:case="'ai'">Kế hoạch bằng AI</span>
                </li>
            </ol>
            <div th:replace="~{fragments/account :: controls(${currentUser})}"></div>
        </header>
        <aside class="app-sidebar" id="planner-sidebar">
            <a class="app-brand" th:href="@{/plans}">
                <img class="brand-mark" th:src="@{/css/images/planner-logo.png}" alt="" width="38" height="38">
                <span>Planner</span>
            </a>
            <nav th:replace="~{fragments/navigation :: sidebar(${section})}"></nav>
        </aside>
        <main th:replace="${content}" id="main-content"></main>
    </div>
    <details th:replace="~{fragments/reminders :: widget}"></details>
</body>
</html>
