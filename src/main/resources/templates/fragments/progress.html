<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
    <div class="node-progress" th:fragment="indicator(progress)"
         th:classappend="${progress.state.name() == 'AVAILABLE' ? 'node-progress--available' : ''}">
        <span th:text="${progress.state.name() == 'AVAILABLE'
                        ? progress.completedCount + '/' + progress.totalCount + ' việc nhỏ — ' + progress.percentage
                        : progress.label}"></span>
        <progress th:if="${progress.state.name() == 'AVAILABLE'}"
                  th:value="${progress.completedCount}" th:max="${progress.totalCount}"
                  aria-hidden="true"></progress>
    </div>
</body>
</html>
