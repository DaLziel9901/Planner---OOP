spring.application.name=planner

# Set DB_PASSWORD in the IDE run configuration or environment; do not commit it.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/planner}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL schema is applied manually through pgAdmin (see DATABASE.md).
spring.sql.init.mode=never
